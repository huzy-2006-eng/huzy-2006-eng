  <g class="l l7"><text x="286" y="296" class="k">ASK ME ABOUT</text><text x="410" y="296" class="v">CIA Triad <tspan class="ok">→</tspan> <tspan font-size="12"><tspan fill="#58a6ff">confidentiality</tspan> · <tspan fill="#3fb950">integrity</tspan> · <tspan fill="#d29922">availability</tspan></tspan></text></g>
