  <g class="l l5"><text x="286" y="226" class="k">CERTIFIED</text><text x="410" y="226" class="v"><tspan class="ok">✓</tspan> Google Cybersecurity Certificate <tspan class="ok">[VERIFIED]</tspan></text></g>
  <g class="l l6"><text x="286" y="260" class="k">LEARNING</text>
    <rect x="410" y="244" width="56" height="24" rx="12" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/><text x="438" y="260" text-anchor="middle" class="chip">Linux</text>
    <rect x="474" y="244" width="42" height="24" rx="12" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/><text x="495" y="260" text-anchor="middle" class="chip">SQL</text>
    <rect x="524" y="244" width="92" height="24" rx="12" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/><text x="570" y="260" text-anchor="middle" class="chip">PowerShell</text>
    <rect x="624" y="244" width="85" height="24" rx="12" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/><text x="666.5" y="260" text-anchor="middle" class="chip">CLI &amp; GUI</text>
    <rect x="717" y="244" width="92" height="24" rx="12" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/><text x="763" y="260" text-anchor="middle" class="chip">MERN Stack</text>
