    <line x1="55" y1="160" x2="225" y2="160"/><line x1="140" y1="75" x2="140" y2="245"/>
  </g>
  <g clip-path="url(#radar)">
    <path class="sweep" d="M140 160 L140 75 A85 85 0 0 1 225 160 Z" fill="url(#sw)"/>
    <rect class="beam" x="55" y="84" width="170" height="2" fill="#3fb950" fill-opacity=".6"/>
  </g>
  <g fill="none" stroke="#e6edf3" stroke-width="2.500" stroke-linecap="round">
