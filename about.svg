  </g>
  <circle class="blip" cx="186" cy="118" r="3.500" fill="#3fb950"/>
  <circle class="blip" cx="96" cy="196" r="3.500" fill="#3fb950" style="animation-delay:-2.2s"/>
  <circle class="blip" cx="178" cy="212" r="3.500" fill="#d29922" style="animation-delay:-3.2s"/>
  <text x="140" y="278" text-anchor="middle" class="cap">SUBJECT: HUZAIFA</text>
  <text x="140" y="300" text-anchor="middle" class="stat">● IDENTITY VERIFIED</text>

  <g class="l l1"><text x="286" y="90" class="k">NAME</text><text x="410" y="90" class="v">Huzaifa</text></g>
  <g class="l l2"><text x="286" y="124" class="k">PRONOUNS</text><text x="410" y="124" class="v">He/Him</text></g>
  <g class="l l3"><text x="286" y="158" class="k">ROLE</text><text x="410" y="158" class="v">Cybersecurity Enthusiast</text></g>
  <g class="l l4"><text x="286" y="192" class="k">WORKING ON</text><text x="410" y="192" class="v">CompTIA Security+</text>
    <rect x="580" y="182" width="120" height="8" rx="4" fill="#161b22" stroke="#30363d"/>
    <g clip-path="url(#track)"><rect class="seg" x="580" y="182" width="40" height="8" rx="4" fill="#d29922"/></g>
