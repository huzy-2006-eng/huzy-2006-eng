<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Operator profile. Name: Huzaifa. Pronouns: He/Him. Role: Cybersecurity Enthusiast. Certified: Google Cybersecurity Certificate. Working on: CompTIA Security+. Learning: Linux, SQL, PowerShell, CLI and GUI, MERN Stack. Ask me about: CIA Triad.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .tag { font-size: 12px; fill: #8b949e; }
    .k { font-size: 12px; fill: #8b949e; letter-spacing: 2px; }
    .v { font-size: 14px; fill: #e6edf3; }
    .ok { fill: #3fb950; font-weight: 700; }
    .warn { font-size: 12px; fill: #d29922; font-weight: 700; letter-spacing: 1px; }
    .chip { font-size: 12px; fill: #3fb950; }
    .cap { font-size: 12px; fill: #8b949e; letter-spacing: 2px; }
    .stat { font-size: 12px; fill: #3fb950; font-weight: 700; letter-spacing: 2px; animation: blink 1.6s steps(1) infinite; }
    .l { opacity: 0; animation: show 0.01s linear forwards; }
    .l1 { animation-delay: .4s; } .l2 { animation-delay: .8s; } .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.6s; }
    .l5 { animation-delay: 2s; } .l6 { animation-delay: 2.4s; } .l7 { animation-delay: 2.8s; }
    .sweep { transform-origin: 140px 160px; animation: spin 4s linear infinite; }
    .blip { animation: blip 4s linear infinite; }
    .seg { animation: load 1.6s ease-in-out infinite; }
    .beam { animation: beam 3s ease-in-out infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blip { 0%, 100% { opacity: 0; } 10% { opacity: 1; } 60% { opacity: 0; } }
    @keyframes load { from { transform: translateX(-40px); } to { transform: translateX(120px); } }
    @keyframes beam { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(150px); } }
    @keyframes blink { 50% { fill-opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .l { opacity: 1; animation: none; }
      .sweep, .seg, .beam, .stat { animation: none; }
      .blip { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="radar"><circle cx="140" cy="160" r="85"/></clipPath>
    <clipPath id="track"><rect x="580" y="182" width="120" height="8" rx="4"/></clipPath>
  </defs>

  <rect x="1" y="1" width="838" height="328" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="24" y="30" class="tag">// operator_profile — identity scan</text>
  <line x1="262" y1="54" x2="262" y2="306" stroke="#30363d" stroke-dasharray="3 5"/>

  <g fill="none" stroke="#3fb950" stroke-opacity=".35">
