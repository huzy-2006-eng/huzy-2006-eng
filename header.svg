<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Terminal window: whoami — Hello, I'm Huzaifa! Cybersecurity Enthusiast. Currently working on CompTIA Security+.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 13px; fill: #8b949e; }
    .line { font-size: 16px; fill: #e6edf3; }
    .user { fill: #3fb950; }
    .path { fill: #58a6ff; }
    .dim { fill: #8b949e; }
    .name { font-size: 38px; font-weight: 700; fill: #e6edf3; }
    .role { font-size: 18px; fill: #3fb950; }
    .l { opacity: 0; animation: show 0.01s linear forwards; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 1.3s; }
    .l4 { animation-delay: 2.1s; }
    .l5 { animation-delay: 2.9s; }
    .l6 { animation-delay: 3.7s; }
    .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .l { opacity: 1; animation: none; }
      .cursor { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="838" height="298" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M2 13 a11 11 0 0 1 11 -11 h814 a11 11 0 0 1 11 11 v27 h-836 z" fill="#161b22"/>
  <line x1="2" y1="40" x2="838" y2="40" stroke="#30363d" stroke-width="1"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="66" cy="21" r="6" fill="#28c840"/>
  <text x="420" y="25.500" text-anchor="middle" class="title">huzaifa@github: ~</text>

  <text x="32" y="80" class="line l l1"><tspan class="user">huzaifa@github</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan> whoami</text>
  <text x="32" y="132" class="name l l2">Hello, I'm Huzaifa!</text>
  <text x="32" y="164" class="role l l3">Cybersecurity Enthusiast</text>
  <text x="32" y="210" class="line l l4"><tspan class="user">huzaifa@github</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan> cat focus.txt</text>
  <text x="32" y="238" class="line l l5"><tspan class="dim">&gt;</tspan> CompTIA Security+ <tspan class="dim">— in progress</tspan></text>
  <text x="32" y="270" class="line l l6"><tspan class="user">huzaifa@github</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan> <tspan class="cursor">█</tspan></text>
</svg>
