<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-label="Terminal: access granted. Hello, I'm Huzaifa! Cybersecurity Enthusiast. Google Cybersecurity Certified, CompTIA Security+ in progress.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 13px; fill: #8b949e; }
    .line { font-size: 15px; fill: #e6edf3; }
    .user, .ok { fill: #3fb950; }
    .path { fill: #58a6ff; }
    .dim { fill: #8b949e; }
    .grant { font-size: 15px; font-weight: 700; fill: #3fb950; letter-spacing: 3px; }
    .name { font-size: 40px; font-weight: 700; }
    .role { font-size: 17px; fill: #3fb950; }
    .sub { font-size: 13px; fill: #8b949e; }
    .l { opacity: 0; animation: show 0.01s linear forwards; }
    .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 0.9s; } .l3 { animation-delay: 1.4s; }
    .l4 { animation-delay: 2.4s; } .l5 { animation-delay: 2.8s; } .l6 { animation-delay: 3.3s; }
    .l7 { animation-delay: 3.6s; } .l8 { animation-delay: 4.3s; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: fill 1s ease-out 1.4s forwards; }
    .r { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    .scan { animation: scan 5s linear infinite; }
    .g1 { fill: #58a6ff; opacity: 0; animation: g1 4s steps(1) 4s infinite; }
    .g2 { fill: #ff5f57; opacity: 0; animation: g2 4s steps(1) 4s infinite; }
    .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes fill { to { transform: scaleX(1); } }
    @keyframes fall { from { transform: translateY(-240px); } to { transform: translateY(350px); } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(400px); } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes g1 { 0%, 100% { opacity: 0; } 90% { opacity: .8; transform: translate(-4px, 1px); } 93% { opacity: .8; transform: translate(3px, -1px); } 96% { opacity: 0; } }
    @keyframes g2 { 0%, 100% { opacity: 0; } 90% { opacity: .8; transform: translate(4px, -1px); } 93% { opacity: .8; transform: translate(-3px, 2px); } 96% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .l { opacity: 1; animation: none; }
      .bar { transform: none; animation: none; }
      .r, .scan, .g1, .g2, .cursor { animation: none; }
    }
  </style>
